model_list:
  # ──────────────────────────────────────────────────────────
  # Route 1: qwen3-coder — ローカルvLLM（普段使い）
  # ──────────────────────────────────────────────────────────
  - model_name: qwen3-coder
    litellm_params:
      model: openai/qwen3-coder
      api_base: "http://vllm-primary:8000/v1"
      api_key: "dummy"
      max_tokens: 32768
      timeout: 300
      stream_timeout: 300

  # ──────────────────────────────────────────────────────────
  # Route 2: claude-sonnet — クラウド直接（難タスク手動指定）
  # ──────────────────────────────────────────────────────────
  - model_name: claude-sonnet
    litellm_params:
      model: claude-sonnet-4-5
      api_key: "os.environ/ANTHROPIC_API_KEY"
      max_tokens: 16000
      timeout: 120

  # ──────────────────────────────────────────────────────────
  # Route 3: smart-coder — ローカル優先・失敗時Claudeフォールバック
  # （信頼性重視ワークフロー用 / 推奨デフォルト）
  # ──────────────────────────────────────────────────────────
  - model_name: smart-coder
    litellm_params:
      model: openai/qwen3-coder
      api_base: "http://vllm-primary:8000/v1"
      api_key: "dummy"
      max_tokens: 32768
      timeout: 300
      stream_timeout: 300
    fallbacks:
      - claude-sonnet

  # ──────────────────────────────────────────────────────────
  # Claude Code対応エイリアス（ANTHROPIC_BASE_URL経由でローカルvLLMへ）
  # Claude Codeが送るモデル名をそのまま受け取ってvLLMに流す
  # ──────────────────────────────────────────────────────────
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: openai/qwen3-coder
      api_base: "http://vllm-primary:8000/v1"
      api_key: "dummy"
      max_tokens: 32768
      timeout: 300
      stream_timeout: 300

  - model_name: claude-opus-4-7
    litellm_params:
      model: openai/qwen3-coder
      api_base: "http://vllm-primary:8000/v1"
      api_key: "dummy"
      max_tokens: 32768
      timeout: 300
      stream_timeout: 300

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: openai/qwen3-coder
      api_base: "http://vllm-primary:8000/v1"
      api_key: "dummy"
      max_tokens: 16384
      timeout: 180
      stream_timeout: 180

  # ──────────────────────────────────────────────────────────
  # OpenAI互換エイリアス（後方互換）
  # ──────────────────────────────────────────────────────────
  - model_name: gpt-4o
    litellm_params:
      model: openai/qwen3-coder
      api_base: "http://vllm-primary:8000/v1"
      api_key: "dummy"
      max_tokens: 32768
      timeout: 300

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/qwen3-coder
      api_base: "http://vllm-primary:8000/v1"
      api_key: "dummy"
      max_tokens: 16384
      timeout: 180

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 5

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: null
  allow_requests_on_db_unavailable: true
  request_timeout: 300

litellm_settings:
  log_level: "INFO"
  success_callback: []
  failure_callback: []
  callbacks: []
  cache: false
  drop_params: true
  num_retries: 2
  request_timeout: 300

environment_variables:
  LITELLM_MASTER_KEY: "os.environ/LITELLM_MASTER_KEY"
  ANTHROPIC_API_KEY: "os.environ/ANTHROPIC_API_KEY"
