# =============================================================================
# docker-compose.yml — cocoro-llm-server
# Stack: vLLM (Qwen3.6-35B-A3B-FP8 / マルチモーダル) + LiteLLM
#
# 起動: docker compose up -d
# ログ: docker compose logs -f vllm-primary
# 停止: docker compose down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # vLLM Primary — Qwen3.6-35B-A3B-FP8 (マルチモーダル: テキスト/コード + 画像/動画)
  # Port: 8000 (LAN debug), internally :8000
  # VRAM: ~35GB weights (FP8) + KV cache @ gpu_util=0.92
  # ---------------------------------------------------------------------------
  vllm-primary:
    image: vllm/vllm-openai:latest
    container_name: vllm-primary
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_HOME=/usr/local/cuda
      # Blackwell SM120 最適化
      - VLLM_ATTENTION_BACKEND=FLASHINFER
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_USE_V1=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=${HF_CACHE_DIR:-/hf_cache}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - ${HF_CACHE_DIR:-./hf_cache}:/hf_cache
      - /models:/models
    ports:
      - "8000:8000"
    command: >
      --model ${PRIMARY_MODEL_PATH:-Qwen/Qwen3.6-35B-A3B-FP8}
      --served-model-name qwen3-coder
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --quantization fp8
      --kv-cache-dtype fp8
      --gpu-memory-utilization ${PRIMARY_GPU_UTIL:-0.92}
      --max-model-len ${PRIMARY_MAX_MODEL_LEN:-262144}
      --max-num-seqs ${PRIMARY_MAX_NUM_SEQS:-32}
      --block-size 32
      --tensor-parallel-size 1
      --enable-chunked-prefill
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --trust-remote-code
      --no-enable-log-requests
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ---------------------------------------------------------------------------
  # LiteLLM Gateway — OpenAI互換プロキシ
  # Port: 4000
  # Routes: qwen3-coder / claude-sonnet / smart-coder (fallback)
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    depends_on:
      vllm-primary:
        condition: service_healthy
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=null
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  # ---------------------------------------------------------------------------
  # Anthropic SSE Proxy — Claude Code向けSSE修正レイヤー
  # Port: 4001 (Claude CodeのANTHROPIC_BASE_URLはここを向ける)
  # ---------------------------------------------------------------------------
  anthropic-proxy:
    build: ./gateway
    container_name: anthropic-proxy
    depends_on:
      - litellm
    ports:
      - "4001:4001"
    restart: unless-stopped
    healthcheck:
      # bootstrap はプロキシ内モックのため LiteLLM の状態に依存しない
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4001/bootstrap\", timeout=3)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: cocoro-llm-net
