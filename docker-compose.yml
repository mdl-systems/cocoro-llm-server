# =============================================================================
# docker-compose.yml — cocoro-llm-server
# Stack: vLLM (Qwen3-Coder-Next-FP8) + LiteLLM + Open WebUI
#
# 起動: docker compose up -d
# ログ: docker compose logs -f vllm-primary
# 停止: docker compose down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # vLLM Primary — Qwen3-Coder-Next-FP8
  # Port: 8000 (LAN debug), internally :8000
  # VRAM: ~70GB weights + ~20GB KV cache @ gpu_util=0.92
  # ---------------------------------------------------------------------------
  vllm-primary:
    image: vllm/vllm-openai:latest
    container_name: vllm-primary
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_HOME=/usr/local/cuda
      # Blackwell SM120 最適化
      - VLLM_ATTENTION_BACKEND=FLASHINFER
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_USE_V1=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - HF_HOME=${HF_CACHE_DIR:-/hf_cache}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - ${HF_CACHE_DIR:-./hf_cache}:/hf_cache
      - /models:/models
    ports:
      - "8000:8000"
    command: >
      --model ${PRIMARY_MODEL_PATH:-Qwen/Qwen3-Coder-Next-FP8}
      --served-model-name qwen3-coder
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --quantization fp8
      --kv-cache-dtype fp8
      --gpu-memory-utilization ${PRIMARY_GPU_UTIL:-0.92}
      --max-model-len ${PRIMARY_MAX_MODEL_LEN:-262144}
      --max-num-seqs ${PRIMARY_MAX_NUM_SEQS:-32}
      --block-size 32
      --tensor-parallel-size 1
      --enable-chunked-prefill
      --enable-prefix-caching
      --tool-call-parser qwen3_coder
      --trust-remote-code
      --no-enable-log-requests
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # ---------------------------------------------------------------------------
  # LiteLLM Gateway — OpenAI互換プロキシ
  # Port: 4000
  # Routes: qwen3-coder / claude-sonnet / smart-coder (fallback)
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    depends_on:
      vllm-primary:
        condition: service_healthy
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=null
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Open WebUI — ローカルLLM UI
  # Port: 3000
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      - WEBUI_SECRET_KEY=${OPEN_WEBUI_SECRET_KEY}
      - WEBUI_AUTH=true
      - DEFAULT_MODELS=smart-coder
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "3000:8080"
    restart: unless-stopped

volumes:
  open-webui-data:

networks:
  default:
    name: cocoro-llm-net
