# =============================================================================
# docker-compose.yml — cocoro-llm-server
# Stack: vLLM + LiteLLM + anthropic-proxy
#
# 起動: docker compose up -d
# ログ: docker compose logs -f vllm-primary
# 停止: docker compose down
# =============================================================================

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ ⚙  編集ポイント — 設定を変えたい時は **このブロックだけ** 触る           ║
# ║                                                                          ║
# ║   下の services: 以下の本体は二度と編集不要。                            ║
# ║   編集後は: docker compose down && docker compose up -d                  ║
# ║                                                                          ║
# ║   詳細は docs/OPERATIONS.md の「変更パターン別の編集箇所」を参照。       ║
# ╚══════════════════════════════════════════════════════════════════════════╝
x-config: &config
  # ── モデル定義（系統を変える時はここ全部を差し替え）──────────────────────
  # 例: Llama に変えるなら HF_MODEL を差し替え、 TOOL_CALL_PARSER を
  #     "llama3_json" 等に、REASONING_PARSER は外す/合わせる。
  HF_MODEL:           "Qwen/Qwen3.6-35B-A3B-FP8"  # HuggingFace のモデル ID
  SERVED_MODEL_NAME:  "coco-local"                # クライアントから呼ぶ公開名
  TOOL_CALL_PARSER:   "qwen3_coder"               # ツールコール解釈 (モデル系統依存)
  REASONING_PARSER:   "qwen3"                     # 思考モード解釈   (モデル系統依存)
  QUANTIZATION:       "fp8"                       # 量子化方式
  KV_CACHE_DTYPE:     "fp8"                       # KV キャッシュ精度

  # ── VRAM / 並列度チューニング ─────────────────────────────────────────────
  GPU_MEMORY_UTIL:    "0.70"                      # VRAM 使用率 (0.5〜0.95)
  MAX_MODEL_LEN:      "131072"                    # コンテキスト総量 (tokens)
  MAX_NUM_SEQS:       "16"                        # 同時並列リクエスト数

  # ── GPU 選択 ──────────────────────────────────────────────────────────────
  CUDA_VISIBLE_GPU:   "0"                         # 複数 GPU を積んだ時はここ

services:
  # ---------------------------------------------------------------------------
  # vLLM Primary — ローカル推論エンジン本体
  # Port: 8000 (LAN debug only — クライアントは :4000 / :4001 を使う)
  # ---------------------------------------------------------------------------
  vllm-primary:
    image: vllm/vllm-openai:latest
    container_name: vllm-primary
    runtime: nvidia
    environment:
      <<: *config       # ↑ x-config の全キーをここに注入
      # ↓ 以下は変更しない固定値（Blackwell SM120 最適化など）
      NVIDIA_VISIBLE_DEVICES: "${CUDA_VISIBLE_GPU:-0}"
      CUDA_HOME: "/usr/local/cuda"
      VLLM_ATTENTION_BACKEND: "FLASHINFER"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      VLLM_USE_V1: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      HF_HOME: "${HF_CACHE_DIR:-/hf_cache}"
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN}"
    volumes:
      # 既定は絶対 /hf_cache (HF_HOME と一致させる)。
      - ${HF_CACHE_DIR:-/hf_cache}:/hf_cache
      - /models:/models
    ports:
      - "8000:8000"
    # vllm-openai のデフォルト entrypoint を sh -c でラップして
    # $VAR を container 内 shell で展開できるようにする。
    # $$ は compose で literal $ にエスケープされる。
    entrypoint: ["sh", "-c"]
    command:
      - >
        exec python3 -m vllm.entrypoints.openai.api_server
        --model "$$HF_MODEL"
        --served-model-name "$$SERVED_MODEL_NAME"
        --host 0.0.0.0
        --port 8000
        --dtype auto
        --quantization "$$QUANTIZATION"
        --kv-cache-dtype "$$KV_CACHE_DTYPE"
        --gpu-memory-utilization "$$GPU_MEMORY_UTIL"
        --max-model-len "$$MAX_MODEL_LEN"
        --max-num-seqs "$$MAX_NUM_SEQS"
        --block-size 32
        --tensor-parallel-size 1
        --enable-chunked-prefill
        --enable-prefix-caching
        --scheduling-policy priority
        --enable-auto-tool-choice
        --tool-call-parser "$$TOOL_CALL_PARSER"
        --reasoning-parser "$$REASONING_PARSER"
        --trust-remote-code
        --no-enable-log-requests
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # コールドスタートは モデルロード+コンパイル+warmup で約5分。
      # 余裕を持って 600s (これを縮めると毎回偽 unhealthy になる)。
      start_period: 600s

  # ---------------------------------------------------------------------------
  # LiteLLM Gateway — OpenAI 互換プロキシ
  # Port: 4000
  # config.yaml.tmpl から起動時に sed で実値展開 (litellm/entrypoint.sh)
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    depends_on:
      vllm-primary:
        condition: service_healthy
    environment:
      <<: *config       # SERVED_MODEL_NAME を受け取るため（他のキーは使われない）
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      DATABASE_URL: "null"
    volumes:
      - ./litellm/config.yaml.tmpl:/app/config.yaml.tmpl:ro
      - ./litellm/entrypoint.sh:/app/entrypoint.sh:ro
    ports:
      - "4000:4000"
    entrypoint: ["sh", "/app/entrypoint.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # anthropic-proxy — Claude Code 向け Anthropic → OpenAI 変換レイヤー
  # Port: 4001 (Claude Code の ANTHROPIC_BASE_URL はここを向ける)
  # ---------------------------------------------------------------------------
  anthropic-proxy:
    build: ./gateway
    container_name: anthropic-proxy
    depends_on:
      - litellm
    environment:
      # 変換前後のデバッグダンプ。既定は空＝オフ
      # （会話全文がディスクに残るので常時は有効にしない）。
      # 有効化: .env に PROXY_DUMP_DIR=/dumps を書いて
      #         docker compose up -d anthropic-proxy
      # 出力先: ホストの PROXY_DUMP_HOST_DIR（既定 /var/tmp/proxy-dumps）
      PROXY_DUMP_DIR: "${PROXY_DUMP_DIR:-}"
    volumes:
      - ${PROXY_DUMP_HOST_DIR:-/var/tmp/proxy-dumps}:/dumps
    ports:
      - "4001:4001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4001/bootstrap\", timeout=3)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: cocoro-llm-net
